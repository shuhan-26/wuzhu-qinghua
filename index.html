<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b52237">
  <title>无主情话</title>
  <style>
    :root {
      color-scheme: dark;
      --red: #b52237;
      --scene-color: #b52237;
      --orange: #e95c31;
      --gold: #f0b84b;
      --cream: #f7e9d4;
      --teal: #153e3d;
      --muted: rgba(247, 233, 212, .72);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      color: var(--cream);
      background: var(--scene-color);
      transition: background-color .7s ease;
      overflow-x: hidden;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: var(--scene-color);
      transition: background-color .7s ease;
      content: "";
    }

    body::after {
      position: fixed;
      inset: 0;
      z-index: 5;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.27'/%3E%3C/svg%3E");
      content: "";
      opacity: .13;
      pointer-events: none;
    }

    button { font: inherit; }
    .frame {
      position: relative;
      display: flex;
      min-height: 100svh;
      flex-direction: column;
      padding: 25px 36px 22px;
      isolation: isolate;
    }

    .frame::before, .frame::after {
      position: absolute;
      z-index: -1;
      content: "";
      pointer-events: none;
    }
    .frame::before { top: 0; left: 7.2%; width: 1px; height: 100%; background: rgba(247, 233, 212, .22); }
    .frame::after { right: 0; bottom: 16%; width: 17%; height: 1px; background: rgba(240, 184, 75, .6); }

    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .masthead { font-family: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif; font-size: 14px; letter-spacing: .18em; }
    .masthead span { color: var(--gold); }
    .edition { color: var(--muted); font-size: 10px; letter-spacing: .16em; }

    main {
      position: relative;
      display: grid;
      flex: 1;
      align-content: center;
      justify-items: center;
      padding: 36px 240px 58px;
      text-align: center;
    }

    .chapter { margin: 0 0 22px; color: var(--gold); font-size: 10px; letter-spacing: .28em; }
    .intro { margin: 17px 0 0; color: rgba(255, 238, 220, .84); font-size: 13px; letter-spacing: .12em; }
    .rule { width: 36px; height: 1px; margin: 33px auto 25px; background: var(--gold); }

    .quote-area { position: relative; width: min(1120px, 100%); min-height: 230px; display: grid; align-content: center; justify-items: center; }
    .particle-canvas { position: absolute; inset: 0; z-index: 1; display: block; width: 100%; height: 100%; pointer-events: none; }
    .particle-canvas[hidden] { display: none; }
    .particle-canvas.is-fading { opacity: 0; transition: opacity .5s ease; }
    .quote {
      position: relative;
      z-index: 2;
      margin: 0;
      max-width: 1000px;
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
      font-size: 60px;
      font-weight: 400;
      line-height: 1.65;
      letter-spacing: .08em;
      text-wrap: balance;
      overflow-wrap: anywhere;
    }
    .quote.is-forming { opacity: 0; }
    .quote.is-visible { animation: subtitle-in .55s ease-out both; }
    .source { margin-top: 15px; color: rgba(247, 233, 212, .78); font-size: 12px; letter-spacing: .08em; }
    .source.is-visible { animation: source-in .65s .16s both; }
    .source[hidden] { display: none; }

    @keyframes subtitle-in {
      0% { opacity: 0; filter: blur(2px); transform: translateY(5px); }
      100% { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @keyframes source-in {
      0% { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .controls { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 28px; }
    .next-button {
      min-width: 156px;
      min-height: 44px;
      padding: 0 17px;
      border: 1px solid rgba(247, 233, 212, .68);
      border-radius: 0;
      color: var(--cream);
      background: transparent;
      font-size: 12px;
      letter-spacing: .12em;
      cursor: pointer;
      transition: color .25s ease, background .25s ease;
    }
    .next-button:hover { color: var(--red); background: var(--cream); }
    .next-button:focus-visible, .camera__retry:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    .hint { color: rgba(247, 233, 212, .69); font-size: 11px; }

    .camera {
      position: absolute;
      right: 5.5%;
      bottom: 8%;
      width: 146px;
    }
    .camera__label { display: flex; justify-content: space-between; margin-bottom: 7px; color: var(--cream); font-size: 9px; letter-spacing: .12em; }
    .camera__label span:last-child { color: var(--gold); }
    .camera__view {
      position: relative;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border: 1px solid rgba(247, 233, 212, .56);
      background: var(--teal);
    }
    video { display: block; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .camera__placeholder { position: absolute; inset: 0; display: grid; place-items: center; padding: 15px; color: rgba(247, 233, 212, .77); font-family: "Songti SC", "STSong", Georgia, serif; font-size: 12px; line-height: 1.8; text-align: center; }
    .camera__placeholder[hidden] { display: none; }
    .camera__status { min-height: 32px; display: flex; align-items: center; gap: 7px; color: rgba(247, 233, 212, .78); font-size: 9px; line-height: 1.5; }
    .camera__dot { width: 6px; height: 6px; flex: 0 0 auto; border-radius: 50%; background: var(--gold); }
    .camera__dot[data-active="true"] { background: #b8de9b; box-shadow: 0 0 9px #b8de9b; }
    .camera__retry { padding: 0; border: 0; color: var(--cream); background: none; font-size: 10px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

    footer { color: rgba(247, 233, 212, .69); font-size: 9px; letter-spacing: .1em; }
    @media (min-width: 761px) and (max-width: 1200px) {
      main { padding: 44px 150px 66px 120px; }
      .quote { font-size: 46px; }
      .camera { right: 3%; width: 105px; }
    }
    @media (max-width: 760px) {
      .frame { min-height: 100svh; padding: 20px 21px 17px; }
      .frame::before { left: 12px; }
      .frame::after { bottom: 25%; width: 12%; }
      main { padding: 30px 8px 210px; }
      .quote-area { min-height: 220px; }
      .quote { font-size: 32px; line-height: 1.7; letter-spacing: .06em; }
      .camera { right: 22px; bottom: 24px; width: 86px; }
      .camera__status { min-height: 28px; }
      footer { font-size: 8px; letter-spacing: .04em; }
    }
    @media (max-width: 390px) {
      .edition { font-size: 8px; }
      main { padding-right: 0; padding-left: 0; }
      .quote { font-size: 29px; }
      footer span:last-child { max-width: 46%; text-align: right; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header>
      <div class="masthead"><span>VOL.</span> 01 &nbsp; 无主情话</div>
      <div class="edition" id="collection-count">一段未寄出的心事</div>
    </header>

    <main>
      <p class="chapter">A LOVE LETTER WITHOUT AN ADDRESS</p>
      <p class="intro">如果此刻刚好被看见，就把这句话当作写给你的。</p>
      <div class="rule" aria-hidden="true"></div>
      <section class="quote-area" aria-live="polite" aria-atomic="true">
        <canvas class="particle-canvas" id="particle-canvas" aria-hidden="true" hidden></canvas>
        <p class="quote" id="quote-text">等一张脸，来领走一句心事。</p>
        <div class="source" id="quote-source" hidden></div>
      </section>
      <div class="controls">
        <button class="next-button" id="next-button" type="button">再遇见一句　↗</button>
      </div>

      <aside class="camera" aria-label="人脸检测状态">
        <div class="camera__label"><span>此刻的你</span><span>FACE / 01</span></div>
        <div class="camera__view">
          <video id="camera-video" autoplay muted playsinline aria-label="摄像头实时画面"></video>
          <div class="camera__placeholder" id="camera-placeholder">等光线落下，<br>就会看见你。</div>
        </div>
        <div class="camera__status" role="status" aria-live="polite">
          <span class="camera__dot" id="camera-dot" aria-hidden="true"></span>
          <span id="camera-status">正在请求摄像头权限…</span>
        </div>
        <div id="camera-action"></div>
      </aside>
    </main>

    <footer><span>从你的文档中，挑选一封未寄出的信。</span><span>表情判断仅供互动参考，画面只在本机处理。</span></footer>
  </div>

  <script>
    const loveNotes = [
      { id: "note-001", text: "我行过许多地方的桥，看过许多次数的云，喝过许多种类的酒，却只爱过一个正当最好年龄的人。", source: "沈从文", category: "现代文学", style: "深情" },
      { id: "note-002", text: "我们相爱一生，一生还是太短。", source: "沈从文", category: "现代文学", style: "深情" },
      { id: "note-003", text: "我明白你会来，所以我等。", source: "沈从文", category: "现代文学", style: "含蓄" },
      { id: "note-004", text: "一想到你，我这张丑脸上就泛起微笑。", source: "王小波", category: "现代文学", style: "轻甜" },
      { id: "note-005", text: "你要是愿意，我就永远爱你；你要是不愿意，我就永远相思。", source: "王小波", category: "现代文学", style: "深情" },
      { id: "note-006", text: "爱你就像爱生命。", source: "王小波", category: "现代文学", style: "深情" },
      { id: "note-007", text: "不管我本人多么平庸，我总觉得对你的爱很美。", source: "王小波", category: "现代文学", style: "温柔" },
      { id: "note-008", text: "你是爱，是暖，是希望，你是人间四月天。", source: "林徽因", category: "现代文学", style: "温柔" },
      { id: "note-009", text: "你是一树一树的花开，是燕在梁间呢喃。", source: "林徽因", category: "现代文学", style: "文艺" },
      { id: "note-010", text: "去见你的路上，阳光温热，云朵可爱，想必晚风吹来，也是甜的。", source: "冰心", category: "现代文学", style: "轻甜" },
      { id: "note-011", text: "你走，我送你；你来，无论多大的风雨，我都要去接你。", source: "梁实秋", category: "现代文学", style: "温柔" },
      { id: "note-012", text: "我将于茫茫人海中，访我唯一灵魂之伴侣；得之，我幸；不得，我命。", source: "徐志摩", category: "现代文学", style: "古典" },
      { id: "note-013", text: "一生至少该有一次，为了某个人而忘了自己。", source: "徐志摩", category: "现代文学", style: "深情" },
      { id: "note-014", text: "草在结它的种子，风在摇它的叶子。我们站着，不说话，就十分美好。", source: "顾城", category: "现代文学", style: "文艺" },
      { id: "note-015", text: "你站在桥上看风景，看风景人在楼上看你。", source: "卞之琳《断章》", category: "现代文学", style: "含蓄" },
      { id: "note-016", text: "月色与雪色之间，你是第三种颜色。", source: "余光中", category: "现代文学", style: "文艺" },
      { id: "note-017", text: "我曾踏月而来，只因你在山中。", source: "席慕蓉", category: "现代文学", style: "古典" },
      { id: "note-018", text: "我必须是你近旁的一株木棉，作为树的形象和你站在一起。", source: "舒婷《致橡树》", category: "现代文学", style: "深情" },
      { id: "note-019", text: "于千万人之中遇见你所遇见的人，没有早一步，也没有晚一步，刚巧赶上了。", source: "张爱玲", category: "现代文学", style: "文艺" },
      { id: "note-020", text: "醒来觉得甚是爱你。", source: "朱生豪", category: "现代文学", style: "轻甜" },
      { id: "note-021", text: "我爱你，以我童年的信仰，以我一生中所有激动人心的时刻。", source: "陀思妥耶夫斯基《白夜》", category: "外国文学", style: "深情" },
      { id: "note-022", text: "我爱你，不光因为你的样子，还因为和你在一起时，我的样子。", source: "罗伊·克里夫特《爱》", category: "外国文学", style: "温柔" },
      { id: "note-023", text: "爱是想要触碰却又收回手。", source: "塞林格《破碎故事之心》", category: "外国文学", style: "含蓄" },
      { id: "note-024", text: "我的心是旷野的鸟，在你的眼睛里找到了它的天空。", source: "泰戈尔《飞鸟集》", category: "外国文学", style: "文艺" },
      { id: "note-025", text: "爱是理解的别名。", source: "泰戈尔", category: "外国文学", style: "古典" },
      { id: "note-026", text: "爱不是彼此凝视，而是一起眺望同一个方向。", source: "圣埃克苏佩里", category: "外国文学", style: "温柔" },
      { id: "note-027", text: "正是你为你的玫瑰花费的时光，才使你的玫瑰变得如此重要。", source: "圣埃克苏佩里《小王子》", category: "外国文学", style: "温柔" },
      { id: "note-028", text: "如果你在下午四点钟来，那么我在三点钟就会开始感到幸福。", source: "圣埃克苏佩里《小王子》", category: "外国文学", style: "轻甜" },
      { id: "note-029", text: "我的灵魂跟你的一样，我的心也跟你的完全一样。", source: "夏洛蒂·勃朗特《简·爱》", category: "外国文学", style: "深情" },
      { id: "note-030", text: "我就是希斯克利夫！他永远、永远在我心里。", source: "艾米莉·勃朗特《呼啸山庄》", category: "外国文学", style: "深情" },
      { id: "note-031", text: "不论我们的灵魂是什么做成的，他的和我的，一模一样。", source: "艾米莉·勃朗特《呼啸山庄》", category: "外国文学", style: "深情" },
      { id: "note-032", text: "爱不会随岁月变迁而改变，它坚守到世界末日。", source: "莎士比亚《十四行诗》", category: "外国文学", style: "古典" },
      { id: "note-033", text: "你可怀疑星辰如火，但绝不要怀疑我爱你。", source: "莎士比亚", category: "外国文学", style: "深情" },
      { id: "note-034", text: "比起你年轻时的美貌，我更爱你现在饱经风霜的容颜。", source: "杜拉斯《情人》", category: "外国文学", style: "深情" },
      { id: "note-035", text: "我遇见你，我记得你，你天生就适合我的灵魂。", source: "杜拉斯《广岛之恋》", category: "外国文学", style: "文艺" },
      { id: "note-036", text: "我对你的爱与日俱增，今天比昨天多，明天比今天多。", source: "马尔克斯《霍乱时期的爱情》", category: "外国文学", style: "深情" },
      { id: "note-037", text: "我爱你，与你无关，它只属于我的心。", source: "歌德", category: "外国文学", style: "含蓄" },
      { id: "note-038", text: "灵魂与灵魂的相遇，是生命中罕见的馈赠。", source: "黑塞《悉达多》", category: "外国文学", style: "文艺" },
      { id: "note-039", text: "在我贫瘠的土地上，你是最后的玫瑰。", source: "聂鲁达", category: "外国文学", style: "古典" },
      { id: "note-040", text: "我曾经默默无语、毫无指望地爱过你。", source: "普希金", category: "外国文学", style: "含蓄" },
      { id: "note-041", text: "死生契阔，与子成说。执子之手，与子偕老。", source: "《诗经·邶风·击鼓》", category: "古诗词", style: "古典" },
      { id: "note-042", text: "青青子衿，悠悠我心。", source: "《诗经·郑风·子衿》", category: "古诗词", style: "含蓄" },
      { id: "note-043", text: "今夕何夕，见此良人。", source: "《诗经·唐风·绸缪》", category: "古诗词", style: "古典" },
      { id: "note-044", text: "风雨如晦，鸡鸣不已。既见君子，云胡不喜。", source: "《诗经·郑风·风雨》", category: "古诗词", style: "古典" },
      { id: "note-045", text: "投我以木桃，报之以琼瑶。匪报也，永以为好也。", source: "《诗经·卫风·木瓜》", category: "古诗词", style: "古典" },
      { id: "note-046", text: "山有木兮木有枝，心悦君兮君不知。", source: "《越人歌》", category: "古诗词", style: "古风" },
      { id: "note-047", text: "愿为西南风，长逝入君怀。", source: "曹植《七哀诗》", category: "古诗词", style: "古风" },
      { id: "note-048", text: "结发为夫妻，恩爱两不疑。", source: "苏武《留别妻》", category: "古诗词", style: "古典" },
      { id: "note-049", text: "愿得一心人，白头不相离。", source: "卓文君《白头吟》", category: "古诗词", style: "古典" },
      { id: "note-050", text: "入我相思门，知我相思苦。", source: "李白《秋风词》", category: "古诗词", style: "古风" },
      { id: "note-051", text: "红豆生南国，春来发几枝。愿君多采撷，此物最相思。", source: "王维《相思》", category: "古诗词", style: "古典" },
      { id: "note-052", text: "在天愿作比翼鸟，在地愿为连理枝。", source: "白居易《长恨歌》", category: "古诗词", style: "古典" },
      { id: "note-053", text: "曾经沧海难为水，除却巫山不是云。", source: "元稹《离思五首·其四》", category: "古诗词", style: "深情" },
      { id: "note-054", text: "身无彩凤双飞翼，心有灵犀一点通。", source: "李商隐《无题》", category: "古诗词", style: "含蓄" },
      { id: "note-055", text: "何当共剪西窗烛，却话巴山夜雨时。", source: "李商隐《夜雨寄北》", category: "古诗词", style: "温柔" },
      { id: "note-056", text: "两情若是久长时，又岂在朝朝暮暮。", source: "秦观《鹊桥仙》", category: "古诗词", style: "深情" },
      { id: "note-057", text: "此情无计可消除，才下眉头，却上心头。", source: "李清照《一剪梅》", category: "古诗词", style: "含蓄" },
      { id: "note-058", text: "天涯地角有穷时，只有相思无尽处。", source: "晏殊《玉楼春》", category: "古诗词", style: "古典" },
      { id: "note-059", text: "只愿君心似我心，定不负相思意。", source: "李之仪《卜算子》", category: "古诗词", style: "深情" },
      { id: "note-060", text: "人生若只如初见，何事秋风悲画扇。", source: "纳兰性德《木兰花》", category: "古诗词", style: "含蓄" },
      { id: "note-061", text: "如果有多一张船票，你会不会跟我一起走？", source: "《花样年华》", category: "影视台词", style: "含蓄" },
      { id: "note-062", text: "爱情这东西，时间很关键。认识得太早或太晚，都不行。", source: "《2046》", category: "影视台词", style: "文艺" },
      { id: "note-063", text: "黎耀辉，不如我们重新开始。", source: "《春光乍泄》", category: "影视台词", style: "深情" },
      { id: "note-064", text: "一切都停止了，这夜晚停止了，那月亮停止了。", source: "《暗恋桃花源》", category: "影视台词", style: "文艺" },
      { id: "note-065", text: "之凡，这些年，你有没有想过我？", source: "《暗恋桃花源》", category: "影视台词", style: "含蓄" },
      { id: "note-066", text: "差一年、一个月、一天、一个时辰，都不算一辈子。", source: "《霸王别姬》", category: "影视台词", style: "深情" },
      { id: "note-067", text: "任凭弱水三千，我只取一瓢饮。", source: "《红楼梦》", category: "影视台词", style: "古典" },
      { id: "note-068", text: "我想就这样牵着你的手不放开，爱可不可以简简单单没有伤害。", source: "《简单爱》", category: "现代流行", style: "轻甜" },
      { id: "note-069", text: "我能想到最浪漫的事，就是和你一起慢慢变老。", source: "《最浪漫的事》", category: "现代流行", style: "温柔" },
      { id: "note-070", text: "陪伴，是我给你最长情的告白。", source: "《陪你度过漫长岁月》", category: "现代流行", style: "温柔" },
      { id: "note-071", text: "我遇见你是最美丽的意外。", source: "《遇见》", category: "现代流行", style: "轻甜" },
      { id: "note-072", text: "我说所有的酒，都不如你。", source: "《春风十里》", category: "现代流行", style: "文艺" },
      { id: "note-073", text: "然后呢，一起走吧。", source: "五月天", category: "现代流行", style: "轻甜" },
      { id: "note-074", text: "全世界哪里最美？答案是你身边。", source: "五月天", category: "现代流行", style: "甜" },
      { id: "note-075", text: "春风再美也比不上你的笑。", source: "《鬼迷心窍》", category: "现代流行", style: "温柔" },
      { id: "note-076", text: "在有生的瞬间能遇到你，竟花光所有运气。", source: "《明年今日》", category: "现代流行", style: "深情" },
      { id: "note-077", text: "终于等到你，差点要错过你。", source: "《终于等到你》", category: "现代流行", style: "甜" },
      { id: "note-078", text: "爱是天时地利的迷信，原来你也在这里。", source: "《原来你也在这里》", category: "现代流行", style: "文艺" },
      { id: "note-079", text: "我愿变成童话里，你爱的那个天使。", source: "《童话》", category: "现代流行", style: "甜" },
      { id: "note-080", text: "因为爱情，不会轻易悲伤，所以一切都是幸福的模样。", source: "《因为爱情》", category: "现代流行", style: "温柔" },
      { id: "note-081", text: "有的人说不清哪里好，但就是谁都替代不了。", source: "《遗失的美好》", category: "现代流行", style: "深情" },
      { id: "note-082", text: "我不再让你孤单，一起走到地老天荒。", source: "《不再让你孤单》", category: "现代流行", style: "深情" },
      { id: "note-083", text: "我怀念的是无话不说，我怀念的是一起做梦。", source: "《我怀念的》", category: "现代流行", style: "含蓄" },
      { id: "note-084", text: "你是空气，但是好闻胜过了空气。", source: "五月天", category: "现代流行", style: "轻甜" },
      { id: "note-085", text: "就算全世界对你恶语相加，我只对你说上一世情话。", source: "《傲寒》", category: "现代流行", style: "深情" },
      { id: "note-086", text: "小酒窝长睫毛，是你最美的记号。", source: "《小酒窝》", category: "现代流行", style: "轻甜" },
      { id: "note-087", text: "你跳，我也跳。", source: "《泰坦尼克号》", category: "影视台词", style: "深情" },
      { id: "note-088", text: "我永不放手。", source: "《泰坦尼克号》", category: "影视台词", style: "深情" },
      { id: "note-089", text: "你让我的人生完整。", source: "《甜心先生》", category: "影视台词", style: "温柔" },
      { id: "note-090", text: "因为你，我才懂得了爱。", source: "《怦然心动》", category: "影视台词", style: "温柔" },
      { id: "note-091", text: "看着我的眼睛，你会发现你对我意味着什么。", source: "《天使之城》", category: "影视台词", style: "深情" },
      { id: "note-092", text: "我只是想和你在一起，仅此而已。", source: "《爱你，罗茜》", category: "影视台词", style: "含蓄" },
      { id: "note-093", text: "我们永远拥有巴黎。", source: "《卡萨布兰卡》", category: "影视台词", style: "文艺" },
      { id: "note-094", text: "我爱你，从过去到现在，直到未来。", source: "《时空恋旅人》", category: "影视台词", style: "深情" },
      { id: "note-095", text: "你出现的那一刻，就是我故事的开始。", source: "《时空恋旅人》", category: "影视台词", style: "甜" },
      { id: "note-096", text: "你是我唯一想带回家的人。", source: "《请以你的名字呼唤我》", category: "影视台词", style: "温柔" },
      { id: "note-097", text: "我在最好的时候碰到你，是我的运气。", source: "《爱在黎明破晓前》", category: "影视台词", style: "含蓄" },
      { id: "note-098", text: "世间最美的事，莫过于去爱时，同时也被爱着。", source: "《红磨坊》", category: "影视台词", style: "古典" },
      { id: "note-099", text: "世界上有那么多的城镇，城镇中有那么多的酒馆，她却走进了我的。", source: "《卡萨布兰卡》", category: "影视台词", style: "文艺" },
      { id: "note-100", text: "你是我生命中最美好的意外。", source: "《和莎莫的500天》", category: "影视台词", style: "轻甜" },
      { id: "note-101", text: "在青山绿水之间，我想牵着你的手，走过这座桥，桥上是绿叶红花，桥下是流水人家，桥的那头是青丝，桥的这头是白发。", source: "沈从文", category: "文档收录", style: "温柔" },
      { id: "note-102", text: "我把我整个灵魂都给你，连同它的怪癖、耍小脾气、忽明忽暗。", source: "王小波", category: "文档收录", style: "文艺" },
      { id: "note-103", text: "我寄你的信，总要送往邮局，不喜欢放在街边的绿色邮筒中，我总疑心那里会慢一点。", source: "鲁迅", category: "文档收录", style: "轻甜" },
      { id: "note-104", text: "十年携手共艰危，以沫相濡亦可哀；聊借画图怡倦眼，此中甘苦两心知。", source: "鲁迅", category: "文档收录", style: "文艺" },
      { id: "note-105", text: "我爱你朴素，不爱你奢华。", source: "徐志摩", category: "文档收录", style: "文艺" },
      { id: "note-106", text: "你是人间四月天。", source: "林徽因", category: "文档收录", style: "文艺" },
      { id: "note-107", text: "不要问我心里有没有你，我的余光中都是你。", source: "余光中", category: "文档收录", style: "含蓄" },
      { id: "note-108", text: "如何让你遇见我，在我最美丽的时刻。", source: "席慕蓉《一棵开花的树》", category: "文档收录", style: "含蓄" },
      { id: "note-109", text: "我如果爱你——绝不像攀援的凌霄花，借你的高枝炫耀自己。", source: "舒婷《致橡树》", category: "文档收录", style: "文艺" },
      { id: "note-110", text: "你见，或者不见我，我就在那里，不悲不喜。", source: "扎西拉姆多多", category: "文档收录", style: "文艺" },
      { id: "note-111", text: "遇见你，我变得很低很低，一直低到尘埃里去，但我的心是欢喜的。", source: "张爱玲", category: "文档收录", style: "含蓄" },
      { id: "note-112", text: "我要你知道，在这个世界上总有一个人是等着你的。", source: "张爱玲《半生缘》", category: "文档收录", style: "文艺" },
      { id: "note-113", text: "海上月是天上月，眼前人是心上人。", source: "张爱玲《倾城之恋》", category: "文档收录", style: "文艺" },
      { id: "note-114", text: "你还不来，我怎敢老去。", source: "张爱玲", category: "文档收录", style: "文艺" },
      { id: "note-115", text: "情不知所起，一往而深。", source: "汤显祖《牡丹亭》", category: "文档收录", style: "文艺" },
      { id: "note-116", text: "则为你如花美眷，似水流年。", source: "汤显祖《牡丹亭》", category: "文档收录", style: "文艺" },
      { id: "note-117", text: "我进清华，一为读书，二为钟书。", source: "杨绛", category: "文档收录", style: "文艺" },
      { id: "note-118", text: "我见到她之前，从未想到要结婚；我娶了她几十年，从未后悔娶她。", source: "钱钟书", category: "文档收录", style: "文艺" },
      { id: "note-119", text: "在遇到她以前，我从未想过结婚的事。和她在一起这么多年，我也从未想过娶别的女人。", source: "钱钟书《围城》", category: "文档收录", style: "温柔" },
      { id: "note-120", text: "我愿意舍弃一切，以想念你终此一生。", source: "朱生豪", category: "文档收录", style: "深情" },
      { id: "note-121", text: "不要愁老之将至，你老了一定很可爱。", source: "朱生豪", category: "文档收录", style: "轻甜" },
      { id: "note-122", text: "我一天一天明白你的平凡，同时却一天一天愈更深切地爱你。", source: "朱生豪", category: "文档收录", style: "文艺" },
      { id: "note-123", text: "春水初生，春林初盛，春风十里，不如你。", source: "冯唐", category: "文档收录", style: "文艺" },
      { id: "note-124", text: "我偷偷碰了你一下，却不料你如蒲公英散开，此后到处都是你的模样。", source: "贾平凹", category: "文档收录", style: "文艺" },
      { id: "note-125", text: "眼睛为他下着雨，心却为他打着伞，这就是爱情。", source: "泰戈尔", category: "文档收录", style: "文艺" },
      { id: "note-126", text: "你微微地笑着，不同我说什么话，而我觉得，为了这个，我已等待得很久了。", source: "泰戈尔《飞鸟集》", category: "文档收录", style: "轻甜" },
      { id: "note-127", text: "也许世界上有五千朵玫瑰和你一样的花，但只有你是我唯一的玫瑰。", source: "圣埃克苏佩里《小王子》", category: "文档收录", style: "深情" },
      { id: "note-128", text: "如果你爱上了某个星球的一朵花，那么只要在夜晚仰望星空，就会觉得很幸福。", source: "圣埃克苏佩里《小王子》", category: "文档收录", style: "文艺" },
      { id: "note-129", text: "对我来说，你无非是个孩子，和其他成千上万个孩子没有什么区别。如果你驯化了我，那我们就会彼此需要。", source: "圣埃克苏佩里《小王子》", category: "文档收录", style: "文艺" },
      { id: "note-130", text: "爱不是用眼睛看，而是用心去看。", source: "圣埃克苏佩里《小王子》", category: "文档收录", style: "文艺" },
      { id: "note-131", text: "你以为我贫穷、低微、不美、缈小，我就没有灵魂，没有心吗？", source: "夏洛蒂·勃朗特《简·爱》", category: "文档收录", style: "文艺" },
      { id: "note-132", text: "我关心我自己。我越是孤独，越是没有支持，我就越尊重自己。", source: "夏洛蒂·勃朗特《简·爱》", category: "文档收录", style: "文艺" },
      { id: "note-133", text: "他永远也不知道我是这么爱他，并不是因为他长得英俊，而是因为他比我更像我自己。", source: "艾米莉·勃朗特《呼啸山庄》", category: "文档收录", style: "深情" },
      { id: "note-134", text: "我爱他脚下的土地，头顶上的空气，他触摸过的每一件东西，他说过的每一句话。", source: "艾米莉·勃朗特《呼啸山庄》", category: "文档收录", style: "文艺" },
      { id: "note-135", text: "我也说不准究竟是在什么时间、什么地点，看见了你什么样的风姿，便使我开始爱上了你。", source: "简·奥斯汀《傲慢与偏见》", category: "文档收录", style: "文艺" },
      { id: "note-136", text: "我能否将你比作夏日？你比夏日更温柔，更动人。", source: "莎士比亚《十四行诗》", category: "文档收录", style: "文艺" },
      { id: "note-137", text: "爱情不是用眼睛看，而是用心去感受。", source: "莎士比亚", category: "文档收录", style: "文艺" },
      { id: "note-138", text: "嘘！那边窗户里亮起的是什么光？那是东方，朱丽叶就是太阳。", source: "莎士比亚《罗密欧与朱丽叶》", category: "文档收录", style: "文艺" },
      { id: "note-139", text: "名字代表什么？我们所称的玫瑰换个名字还是一样芳香。", source: "莎士比亚《罗密欧与朱丽叶》", category: "文档收录", style: "文艺" },
      { id: "note-140", text: "爱情是叹息吹起的一阵烟，恋人的眼中有它净化了的火星。", source: "莎士比亚《罗密欧与朱丽叶》", category: "文档收录", style: "文艺" },
      { id: "note-141", text: "爱是亘古长明的灯塔，它定睛望着风暴却兀不为动。", source: "莎士比亚《十四行诗》", category: "文档收录", style: "文艺" },
      { id: "note-142", text: "我从未奢望你来爱我，能被赐予机会爱你就应心怀感激。", source: "毛姆《面纱》", category: "文档收录", style: "文艺" },
      { id: "note-143", text: "爱之于我，不是肌肤之亲，不是一蔬一饭，它是一种不死的欲望，是疲惫生活中的英雄梦想。", source: "杜拉斯", category: "文档收录", style: "文艺" },
      { id: "note-144", text: "我在世界上最爱的是你。胜过一切。", source: "杜拉斯《情人》", category: "文档收录", style: "文艺" },
      { id: "note-145", text: "爱情，首先是一种本能，要么生下来就会，要么永远都不会。", source: "马尔克斯《霍乱时期的爱情》", category: "文档收录", style: "深情" },
      { id: "note-146", text: "我还太年轻，尚不知道回忆总是会抹去坏的，夸大好的。", source: "马尔克斯《霍乱时期的爱情》", category: "文档收录", style: "文艺" },
      { id: "note-147", text: "我望着月亮，却只看见你。", source: "翁达杰《英国病人》", category: "文档收录", style: "文艺" },
      { id: "note-148", text: "我的心紧张得像根琴弦，你一出现，它就颤个不停。", source: "歌德《少年维特的烦恼》", category: "文档收录", style: "文艺" },
      { id: "note-149", text: "自从认识你起，我便爱上了你，甚至在不认识你时，我已爱着你。", source: "黑塞《悉达多》", category: "文档收录", style: "文艺" },
      { id: "note-150", text: "如果你还在这个世界存在着，那么这个世界无论什么样，对我都是有意义的。", source: "村上春树《挪威的森林》", category: "文档收录", style: "文艺" },
      { id: "note-151", text: "我用什么才能留住你？我给你瘦落的街道、绝望的落日、荒郊的月亮。", source: "博尔赫斯", category: "文档收录", style: "文艺" },
      { id: "note-152", text: "你是贫瘠荒野上骤然升起的永昼。", source: "博尔赫斯", category: "文档收录", style: "文艺" },
      { id: "note-153", text: "我喜欢你是寂静的，仿佛你消失了一样。", source: "聂鲁达", category: "文档收录", style: "轻甜" },
      { id: "note-154", text: "我要在你身上，去做春天在樱桃树上做的事。", source: "聂鲁达", category: "文档收录", style: "文艺" },
      { id: "note-155", text: "你是我新鲜又永恒的春天，是唯一贯穿我所有诗篇的韵脚。", source: "聂鲁达", category: "文档收录", style: "深情" },
      { id: "note-156", text: "我愿意是激流，是山里的小河，只要我的爱人是一条小鱼，在我的浪花中快乐地游来游去。", source: "裴多菲", category: "文档收录", style: "文艺" },
      { id: "note-157", text: "关关雎鸠，在河之洲。窈窕淑女，君子好逑。", source: "《诗经·周南·关雎》", category: "文档收录", style: "文艺" },
      { id: "note-158", text: "有美一人，清扬婉兮。邂逅相遇，适我愿兮。", source: "《诗经·郑风·野有蔓草》", category: "文档收录", style: "文艺" },
      { id: "note-159", text: "静女其姝，俟我于城隅。爱而不见，搔首踟蹰。", source: "《诗经·邶风·静女》", category: "文档收录", style: "文艺" },
      { id: "note-160", text: "沅有芷兮澧有兰，思公子兮未敢言。", source: "屈原《九歌·湘夫人》", category: "文档收录", style: "文艺" },
      { id: "note-161", text: "同心而离居，忧伤以终老。", source: "《古诗十九首·涉江采芙蓉》", category: "文档收录", style: "文艺" },
      { id: "note-162", text: "盈盈一水间，脉脉不得语。", source: "《古诗十九首·迢迢牵牛星》", category: "文档收录", style: "文艺" },
      { id: "note-163", text: "生当复来归，死当长相思。", source: "苏武《留别妻》", category: "文档收录", style: "文艺" },
      { id: "note-164", text: "我欲与君相知，长命无绝衰。", source: "汉乐府《上邪》", category: "文档收录", style: "文艺" },
      { id: "note-165", text: "山无陵，江水为竭，冬雷震震，夏雨雪，天地合，乃敢与君绝。", source: "汉乐府《上邪》", category: "文档收录", style: "文艺" },
      { id: "note-166", text: "一日不见兮，思之如狂。", source: "司马相如《凤求凰》", category: "文档收录", style: "文艺" },
      { id: "note-167", text: "思君如流水，何有穷已时。", source: "徐干《室思》", category: "文档收录", style: "文艺" },
      { id: "note-168", text: "君当作磐石，妾当作蒲苇。蒲苇纫如丝，磐石无转移。", source: "《孔雀东南飞》", category: "文档收录", style: "文艺" },
      { id: "note-169", text: "郎骑竹马来，绕床弄青梅。", source: "李白《长干行》", category: "文档收录", style: "文艺" },
      { id: "note-170", text: "相思相见知何日？此时此夜难为情。", source: "李白《秋风词》", category: "文档收录", style: "文艺" },
      { id: "note-171", text: "长相思，在长安。", source: "李白《长相思》", category: "文档收录", style: "文艺" },
      { id: "note-172", text: "天长路远魂飞苦，梦魂不到关山难。", source: "李白《长相思》", category: "文档收录", style: "文艺" },
      { id: "note-173", text: "海上生明月，天涯共此时。", source: "张九龄《望月怀远》", category: "文档收录", style: "文艺" },
      { id: "note-174", text: "思君如满月，夜夜减清辉。", source: "张九龄《赋得自君之出矣》", category: "文档收录", style: "文艺" },
      { id: "note-175", text: "东边日出西边雨，道是无晴却有晴。", source: "刘禹锡《竹枝词》", category: "文档收录", style: "文艺" },
      { id: "note-176", text: "相恨不如潮有信，相思始觉海非深。", source: "白居易《浪淘沙》", category: "文档收录", style: "文艺" },
      { id: "note-177", text: "天长地久有时尽，此恨绵绵无绝期。", source: "白居易《长恨歌》", category: "文档收录", style: "文艺" },
      { id: "note-178", text: "汴水流，泗水流，流到瓜洲古渡头，吴山点点愁。思悠悠，恨悠悠，恨到归时方始休，月明人倚楼。", source: "白居易《长相思》", category: "文档收录", style: "文艺" },
      { id: "note-179", text: "取次花丛懒回顾，半缘修道半缘君。", source: "元稹《离思五首·其四》", category: "文档收录", style: "文艺" },
      { id: "note-180", text: "相见时难别亦难，东风无力百花残。", source: "李商隐《无题·相见时难别亦难》", category: "文档收录", style: "文艺" },
      { id: "note-181", text: "此情可待成追忆，只是当时已惘然。", source: "李商隐《锦瑟》", category: "文档收录", style: "文艺" },
      { id: "note-182", text: "深知身在情长在，怅望江头江水声。", source: "李商隐《暮秋独游曲江》", category: "文档收录", style: "文艺" },
      { id: "note-183", text: "春心莫共花争发，一寸相思一寸灰。", source: "李商隐《无题·飒飒东风细雨来》", category: "文档收录", style: "文艺" },
      { id: "note-184", text: "直道相思了无益，未妨惆怅是清狂。", source: "李商隐《无题·重帏深下莫愁堂》", category: "文档收录", style: "文艺" },
      { id: "note-185", text: "玲珑骰子安红豆，入骨相思知不知。", source: "温庭筠《南歌子词二首》", category: "文档收录", style: "文艺" },
      { id: "note-186", text: "过尽千帆皆不是，斜晖脉脉水悠悠。肠断白蘋洲。", source: "温庭筠《梦江南》", category: "文档收录", style: "文艺" },
      { id: "note-187", text: "多情却似总无情，唯觉尊前笑不成。", source: "杜牧《赠别》", category: "文档收录", style: "轻甜" },
      { id: "note-188", text: "蜡烛有心还惜别，替人垂泪到天明。", source: "杜牧《赠别》", category: "文档收录", style: "文艺" },
      { id: "note-189", text: "春风十里扬州路，卷上珠帘总不如。", source: "杜牧《赠别二首·其一》", category: "文档收录", style: "文艺" },
      { id: "note-190", text: "人面不知何处去，桃花依旧笑春风。", source: "崔护《题都城南庄》", category: "文档收录", style: "轻甜" },
      { id: "note-191", text: "去年今日此门中，人面桃花相映红。", source: "崔护《题都城南庄》", category: "文档收录", style: "文艺" },
      { id: "note-192", text: "花开堪折直须折，莫待无花空折枝。", source: "杜秋娘《金缕衣》", category: "文档收录", style: "文艺" },
      { id: "note-193", text: "得成比目何辞死，愿作鸳鸯不羡仙。", source: "卢照邻《长安古意》", category: "文档收录", style: "文艺" },
      { id: "note-194", text: "从此无心爱良夜，任他明月下西楼。", source: "李益《写情》", category: "文档收录", style: "文艺" },
      { id: "note-195", text: "忆君心似西江水，日夜东流无歇时。", source: "鱼玄机《江陵愁望有寄》", category: "文档收录", style: "文艺" },
      { id: "note-196", text: "衣带渐宽终不悔，为伊消得人憔悴。", source: "柳永《蝶恋花·伫倚危楼风细细》", category: "文档收录", style: "文艺" },
      { id: "note-197", text: "今宵酒醒何处？杨柳岸，晓风残月。", source: "柳永《雨霖铃·寒蝉凄切》", category: "文档收录", style: "文艺" },
      { id: "note-198", text: "便纵有千种风情，更与何人说。", source: "柳永《雨霖铃·寒蝉凄切》", category: "文档收录", style: "文艺" },
      { id: "note-199", text: "金风玉露一相逢，便胜却人间无数。", source: "秦观《鹊桥仙·纤云弄巧》", category: "文档收录", style: "文艺" },
      { id: "note-200", text: "柔情似水，佳期如梦，忍顾鹊桥归路。", source: "秦观《鹊桥仙·纤云弄巧》", category: "文档收录", style: "文艺" },
      { id: "note-201", text: "夜月一帘幽梦，春风十里柔情。", source: "秦观《八六子·倚危亭》", category: "文档收录", style: "文艺" },
      { id: "note-202", text: "便做春江都是泪，流不尽，许多愁。", source: "秦观《江城子·西城杨柳弄春柔》", category: "文档收录", style: "文艺" },
      { id: "note-203", text: "十年生死两茫茫，不思量，自难忘。", source: "苏轼《江城子·乙卯正月二十日夜记梦》", category: "文档收录", style: "文艺" },
      { id: "note-204", text: "料得年年肠断处，明月夜，短松冈。", source: "苏轼《江城子·乙卯正月二十日夜记梦》", category: "文档收录", style: "文艺" },
      { id: "note-205", text: "枝上柳绵吹又少，天涯何处无芳草。", source: "苏轼《蝶恋花·春景》", category: "文档收录", style: "文艺" },
      { id: "note-206", text: "笑渐不闻声渐悄，多情却被无情恼。", source: "苏轼《蝶恋花·春景》", category: "文档收录", style: "轻甜" },
      { id: "note-207", text: "花自飘零水自流，一种相思，两处闲愁。", source: "李清照《一剪梅·红藕香残玉簟秋》", category: "文档收录", style: "文艺" },
      { id: "note-208", text: "莫道不消魂，帘卷西风，人比黄花瘦。", source: "李清照《醉花阴》", category: "文档收录", style: "文艺" },
      { id: "note-209", text: "去年元夜时，花市灯如昼。月上柳梢头，人约黄昏后。", source: "欧阳修《生查子·元夕》", category: "文档收录", style: "文艺" },
      { id: "note-210", text: "今年元夜时，月与灯依旧。不见去年人，泪满春衫袖。", source: "欧阳修《生查子·元夕》", category: "文档收录", style: "文艺" },
      { id: "note-211", text: "泪眼问花花不语，乱红飞过秋千去。", source: "欧阳修《蝶恋花·庭院深深深几许》", category: "文档收录", style: "文艺" },
      { id: "note-212", text: "离愁渐远渐无穷，迢迢不断如春水。", source: "欧阳修《踏莎行·候馆梅残》", category: "文档收录", style: "文艺" },
      { id: "note-213", text: "无情不似多情苦，一寸还成千万缕。", source: "晏殊《玉楼春·春恨》", category: "文档收录", style: "文艺" },
      { id: "note-214", text: "若有知音见采，不辞遍唱阳春。", source: "晏殊《山亭柳·赠歌者》", category: "文档收录", style: "文艺" },
      { id: "note-215", text: "落花人独立，微雨燕双飞。", source: "晏几道《临江仙·梦后楼台高锁》", category: "文档收录", style: "文艺" },
      { id: "note-216", text: "今宵剩把银釭照，犹恐相逢是梦中。", source: "晏几道《鹧鸪天·彩袖殷勤捧玉钟》", category: "文档收录", style: "文艺" },
      { id: "note-217", text: "欲把相思说似谁，浅情人不知。", source: "晏几道《长相思》", category: "文档收录", style: "文艺" },
      { id: "note-218", text: "日日思君不见君，共饮长江水。", source: "李之仪《卜算子·我住长江头》", category: "文档收录", style: "文艺" },
      { id: "note-219", text: "心似双丝网，中有千千结。", source: "张先《千秋岁·数声鶗鴂》", category: "文档收录", style: "文艺" },
      { id: "note-220", text: "天不老，情难绝。", source: "张先《千秋岁·数声鶗鴂》", category: "文档收录", style: "文艺" },
      { id: "note-221", text: "一川烟草，满城风絮，梅子黄时雨。", source: "贺铸《青玉案·凌波不过横塘路》", category: "文档收录", style: "文艺" },
      { id: "note-222", text: "若问闲愁都几许？一川烟草，满城风絮，梅子黄时雨。", source: "贺铸《青玉案》", category: "文档收录", style: "文艺" },
      { id: "note-223", text: "众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。", source: "辛弃疾《青玉案·元夕》", category: "文档收录", style: "文艺" },
      { id: "note-224", text: "千金纵买相如赋，脉脉此情谁诉。", source: "辛弃疾《摸鱼儿》", category: "文档收录", style: "文艺" },
      { id: "note-225", text: "平生不会相思，才会相思，便害相思。", source: "徐再思《折桂令·春情》", category: "文档收录", style: "文艺" },
      { id: "note-226", text: "问世间，情为何物，直教生死相许。", source: "元好问《摸鱼儿·雁丘词》", category: "文档收录", style: "文艺" },
      { id: "note-227", text: "似此星辰非昨夜，为谁风露立中宵。", source: "黄景仁《绮怀》", category: "文档收录", style: "文艺" },
      { id: "note-228", text: "我养你啊。", source: "《喜剧之王》", category: "文档收录", style: "文艺" },
      { id: "note-229", text: "你是我温暖的手套，冰冷的啤酒，带着阳光味道的衬衫，日复一日的梦想。", source: "《恋爱的犀牛》", category: "文档收录", style: "文艺" },
      { id: "note-230", text: "忘掉是一般人能做的唯一的事，但是我决定不忘掉她。", source: "《恋爱的犀牛》", category: "文档收录", style: "深情" },
      { id: "note-231", text: "如果我是诗人，所有的声音都只为你歌唱；如果我是法官，你的好恶就是我最高的法则。", source: "《恋爱的犀牛》", category: "文档收录", style: "文艺" },
      { id: "note-232", text: "一切白的东西和你相比都成了黑墨水而自惭形秽。", source: "《恋爱的犀牛》", category: "文档收录", style: "文艺" },
      { id: "note-233", text: "一切都停止了，这夜晚停止了，那月亮停止了，那街灯，这个秋千，你和我，一切都停止了。", source: "《暗恋桃花源》", category: "文档收录", style: "文艺" },
      { id: "note-234", text: "不能再等了，再等就老了。", source: "《暗恋桃花源》", category: "文档收录", style: "文艺" },
      { id: "note-235", text: "有些事情不是你说忘就忘得掉的。", source: "《暗恋桃花源》", category: "文档收录", style: "文艺" },
      { id: "note-236", text: "如花美眷，似水流年。", source: "《牡丹亭》", category: "文档收录", style: "文艺" },
      { id: "note-237", text: "原来你是我最想留住的幸运。", source: "《小幸运》", category: "文档收录", style: "轻甜" },
      { id: "note-238", text: "我总算学会了如何去爱，可惜你早已远去，消失在人海。", source: "《后来》", category: "文档收录", style: "文艺" },
      { id: "note-239", text: "有些人一旦错过就不再。", source: "《后来》", category: "文档收录", style: "文艺" },
      { id: "note-240", text: "得不到的永远在骚动，被偏爱的都有恃无恐。", source: "《红玫瑰》", category: "文档收录", style: "深情" },
      { id: "note-241", text: "春风再美也比不上你的笑，没见过你的人不会明了。", source: "《鬼迷心窍》", category: "文档收录", style: "轻甜" },
      { id: "note-242", text: "在最好的年纪遇到你，才算没有辜负自己。", source: "《终于等到你》", category: "文档收录", style: "文艺" },
      { id: "note-243", text: "我愿变成童话里，你爱的那个天使，张开双手变成翅膀守护你。", source: "《童话》", category: "文档收录", style: "文艺" },
      { id: "note-244", text: "我为你翻山越岭，却无心看风景。", source: "《爱就一个字》", category: "文档收录", style: "文艺" },
      { id: "note-245", text: "从前的日色变得慢，车马邮件都慢，一生只够爱一个人。", source: "《从前慢》", category: "文档收录", style: "深情" },
      { id: "note-246", text: "手牵手一步两步三步四步望着天，看星星一颗两颗三颗四颗连成线。", source: "《星晴》", category: "文档收录", style: "文艺" },
      { id: "note-247", text: "就在这花好月圆夜，两心相爱心相悦。", source: "《花好月圆夜》", category: "文档收录", style: "文艺" },
      { id: "note-248", text: "我和你的爱情，好像水晶，没有负担秘密干净又透明。", source: "《水晶》", category: "文档收录", style: "文艺" },
      { id: "note-249", text: "希望你能爱我到地老到天荒，希望你能陪我到海角到天涯。", source: "《选择》", category: "文档收录", style: "文艺" },
      { id: "note-250", text: "当你的眼睛眯着笑，当你喝可乐当你吵，我想对你好你从来不知道。", source: "《当你》", category: "文档收录", style: "轻甜" },
      { id: "note-251", text: "你任何为人称道的美丽，不及他第一次遇见你。", source: "《南山南》", category: "文档收录", style: "含蓄" },
      { id: "note-252", text: "想念是会呼吸的痛，它活在我身上每个角落。", source: "《会呼吸的痛》", category: "文档收录", style: "含蓄" },
      { id: "note-253", text: "相聚离开都有时候，没有什么会永垂不朽。", source: "《红豆》", category: "文档收录", style: "文艺" },
      { id: "note-254", text: "爱上一匹野马，可我的家里没有草原。", source: "《董小姐》", category: "文档收录", style: "文艺" },
      { id: "note-255", text: "相信我不变的真心，千年等待有我承诺，无论经过多少的寒冬，我绝不放手。", source: "《神话》", category: "文档收录", style: "文艺" },
      { id: "note-256", text: "若不是因为爱着你，怎么会夜深还没睡意，每个念头都关于你。", source: "《爱情》", category: "文档收录", style: "文艺" },
      { id: "note-257", text: "你是我一生的挚爱。", source: "《泰坦尼克号》", category: "文档收录", style: "深情" },
      { id: "note-258", text: "当我意识到想和你共度余生时，我希望我的余生越快开始越好。", source: "《当哈利遇上莎莉》", category: "文档收录", style: "文艺" },
      { id: "note-259", text: "一句“你好”，我便沦陷。", source: "《甜心先生》", category: "文档收录", style: "文艺" },
      { id: "note-260", text: "爱，意味着永远不必说抱歉。", source: "《爱情故事》", category: "文档收录", style: "深情" },
      { id: "note-261", text: "我爱你，不是因为你是谁，而是因为在你面前，我可以是谁。", source: "《剪刀手爱德华》", category: "文档收录", style: "文艺" },
      { id: "note-262", text: "我宁愿与你共度一生，也不愿独自面对这世间的沧海桑田。", source: "《指环王》", category: "文档收录", style: "深情" },
      { id: "note-263", text: "我不算聪明，但我知道什么是爱。", source: "《阿甘正传》", category: "文档收录", style: "文艺" },
      { id: "note-264", text: "有些人浅薄，有些人金玉其外，当你遇见一个彩虹般的人，其他人都不过是浮云。", source: "《怦然心动》", category: "文档收录", style: "含蓄" },
      { id: "note-265", text: "我的心因你而笑。", source: "《初恋这件小事》", category: "文档收录", style: "轻甜" },
      { id: "note-266", text: "和你在一起，就像走在一个晴朗的清晨。", source: "《阿甘正传》", category: "文档收录", style: "温柔" },
      { id: "note-267", text: "我需要你，就像我需要呼吸空气。", source: "《当哈利遇上莎莉》", category: "文档收录", style: "文艺" },
      { id: "note-268", text: "你是我的命中注定。", source: "《蓝色生死恋》", category: "文档收录", style: "文艺" },
      { id: "note-269", text: "我永远不会离开你。", source: "《忠犬八公的故事》", category: "文档收录", style: "深情" },
      { id: "note-270", text: "爱是永恒的，而非短暂的。", source: "《罗马假日》", category: "文档收录", style: "文艺" },
      { id: "note-271", text: "我会爱你，直到时间的尽头。", source: "《星际穿越》", category: "文档收录", style: "文艺" },
      { id: "note-272", text: "爱是我们唯一能感知、超越时空维度的东西。", source: "《星际穿越》", category: "文档收录", style: "深情" },
      { id: "note-273", text: "我跨越时间的瀚海来寻找你。", source: "《星际穿越》", category: "文档收录", style: "文艺" },
      { id: "note-274", text: "没有法律，没有限制，只有一条规则：永远也别坠入爱河。", source: "《红磨坊》", category: "文档收录", style: "深情" },
      { id: "note-275", text: "我只是一个女孩，站在喜欢的人面前，祈求他可以爱上自己。", source: "《诺丁山》", category: "文档收录", style: "轻甜" },
      { id: "note-276", text: "明天又是新的一天。", source: "《乱世佳人》", category: "文档收录", style: "文艺" },
      { id: "note-277", text: "对于世界而言，你是一个人；但对于某个人，你是他的整个世界。", source: "《乱世佳人》", category: "文档收录", style: "文艺" },
      { id: "note-278", text: "我喜欢我望向别处时，他望向我的目光。", source: "《爱在黎明破晓前》", category: "文档收录", style: "轻甜" },
      { id: "note-279", text: "纵使最终没能相守，遇见你，已经是我这辈子最幸运的事。", source: "《爱乐之城》", category: "文档收录", style: "轻甜" },
      { id: "note-280", text: "你让我想成为一个更好的人。", source: "《尽善尽美》", category: "文档收录", style: "文艺" },
      { id: "note-281", text: "因为你，我想要变成一个更好的人，发奋努力，只为证明我足以与你相配。", source: "《侧耳倾听》", category: "文档收录", style: "文艺" },
      { id: "note-282", text: "能遇见你，已经很不可思议了。", source: "《不能说的秘密》", category: "文档收录", style: "含蓄" },
      { id: "note-283", text: "你辛苦归辛苦，什么时候有空嫁给我？", source: "《心动》", category: "文档收录", style: "文艺" },
      { id: "note-284", text: "你保护世界，我保护你。", source: "《少年的你》", category: "文档收录", style: "文艺" },
      { id: "note-285", text: "只要两个相爱的人在一起，哪里都是天堂。", source: "《冬日恋歌》", category: "文档收录", style: "温柔" },
      { id: "note-286", text: "我不希望看到你流泪，除非是为了幸福。", source: "《魂断蓝桥》", category: "文档收录", style: "文艺" },
      { id: "note-287", text: "好好生活，慢慢爱你。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-288", text: "世界一般，但你超值。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-289", text: "遇见你，是所有故事的开始。", source: "网络流行文案", category: "文档收录", style: "含蓄" },
      { id: "note-290", text: "山河远阔，人间烟火，无一是你，无一不是你。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-291", text: "从此，有人问我粥可温，有人与我立黄昏。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-292", text: "万物皆甜，而你胜过万物。", source: "网络流行文案", category: "文档收录", style: "轻甜" },
      { id: "note-293", text: "你是我疲惫生活里的温柔梦想。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-294", text: "人间值得，因为有你。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-295", text: "往后余生，皆是你。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-296", text: "温柔和偏爱，我都只给你。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-297", text: "斯人若彩虹，遇上方知有。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-298", text: "我攒了好多年的温柔和可爱，现在都给你。", source: "网络流行文案", category: "文档收录", style: "轻甜" },
      { id: "note-299", text: "你是我明目张胆的偏爱，众所周知的私心。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-300", text: "始于心动，终于白首。", source: "网络流行文案", category: "文档收录", style: "轻甜" },
      { id: "note-301", text: "我想和你，从心动到古稀。", source: "网络流行文案", category: "文档收录", style: "轻甜" },
      { id: "note-302", text: "我喜欢你，胜于昨日，略匮明朝。", source: "网络流行文案", category: "文档收录", style: "轻甜" },
      { id: "note-303", text: "以爱之名，共度余生。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-304", text: "山野万里，我拿来下酒；余生漫漫，我拿来爱你。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-305", text: "星河滚烫，你是人间理想。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-306", text: "入目无别人，四下皆是你。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-307", text: "你是我的今天和所有的明天。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-308", text: "喜你为疾，药石无医。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-309", text: "人间不值得，但你值得。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-310", text: "智者不入爱河，遇你难做智者。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-311", text: "你是年少的欢喜，这句话倒过来也是你。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-312", text: "遇见你，爱意汹涌，看世界都浪漫心动。", source: "网络流行文案", category: "文档收录", style: "轻甜" },
      { id: "note-313", text: "从此，一屋两人，三餐四季。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-314", text: "你是我奔赴的意义。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-315", text: "世界万般美好，都不及你。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-316", text: "遇见你，是我最大的幸运。", source: "网络流行文案", category: "文档收录", style: "轻甜" },
      { id: "note-317", text: "陪伴是最长情的告白。", source: "网络流行文案", category: "文档收录", style: "温柔" },
      { id: "note-318", text: "所爱隔山海，山海皆可平。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-319", text: "新鲜感是和旧的人体验新事物，而不是和新的人重复旧事物。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-320", text: "细节胜过所有情话，陪伴打败所有誓言。", source: "网络流行文案", category: "文档收录", style: "温柔" },
      { id: "note-321", text: "安全感不是源于爱，而是偏爱。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-322", text: "想和你一起在晚风里，说些可爱的废话。", source: "网络流行文案", category: "文档收录", style: "轻甜" },
      { id: "note-323", text: "此时此刻，你在身边，这就够了。", source: "网络流行文案", category: "文档收录", style: "温柔" },
      { id: "note-324", text: "柴米油盐酱醋茶，一点一滴都是幸福在发芽。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-325", text: "你是我疲惫生活中唯一的英雄梦想。", source: "网络流行文案", category: "文档收录", style: "深情" },
      { id: "note-326", text: "人间本不该令我这么欣喜的，但是你来了。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-327", text: "爱你不止七夕，更在昼夜朝夕。", source: "七夕流行文案", category: "文档收录", style: "文艺" },
      { id: "note-328", text: "那就在一起，晨昏、朝暮，三餐、四季。", source: "七夕流行文案", category: "文档收录", style: "温柔" },
      { id: "note-329", text: "世界很大，幸福很小，有你刚刚好。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-330", text: "宇宙熵增不可逆，但爱可以——我会日复一日，重新爱上你。", source: "网络流行文案", category: "文档收录", style: "文艺" },
      { id: "note-331", text: "你在\"随便\"和\"都行\"里，总能找到我没说出口的\"喜欢\"。", source: "网络流行文案", category: "文档收录", style: "轻甜" },
      { id: "note-332", text: "数学不好，但算得最准的是：遇见你，是我100%的幸运。", source: "网络流行文案", category: "文档收录", style: "轻甜" },
      { id: "note-333", text: "最近有谣言说我喜欢你，我要澄清一下，那不是谣言。", source: "网络流行文案", category: "文档收录", style: "轻甜" },
      { id: "note-334", text: "你是我的白月光。", source: "网络流行语", category: "文档收录", style: "文艺" },
      { id: "note-335", text: "爱自己是终身浪漫的开始。", source: "网络流行语", category: "文档收录", style: "文艺" },
      { id: "note-336", text: "爱是细节，不爱也是细节。", source: "网络流行语", category: "文档收录", style: "文艺" }
    ];

    const quoteArea = document.querySelector(".quote-area");
    const quoteText = document.querySelector("#quote-text");
    const quoteSource = document.querySelector("#quote-source");
    const particleCanvas = document.querySelector("#particle-canvas");
    const scenePalettes = [
      { color: "#b52237", shade: "#153e3d" },
      { color: "#007c55", shade: "#123b32" },
      { color: "#1b56b8", shade: "#102e5a" },
      { color: "#007e88", shade: "#103f43" },
      { color: "#ba451e", shade: "#4a2319" }
    ];
    const expressionProfiles = {
      happy: { label: "微笑", styles: ["甜", "轻甜"] },
      sad: { label: "低落表情", styles: ["温柔", "深情"] },
      angry: { label: "皱眉", styles: ["温柔", "含蓄"] },
      fearful: { label: "紧张表情", styles: ["温柔", "含蓄"] },
      disgusted: { label: "俏皮表情", styles: ["轻甜", "甜"] },
      surprised: { label: "惊讶", styles: ["文艺", "轻甜"] }
    };
    const video = document.querySelector("#camera-video");
    const statusText = document.querySelector("#camera-status");
    const cameraDot = document.querySelector("#camera-dot");
    const cameraPlaceholder = document.querySelector("#camera-placeholder");
    const cameraAction = document.querySelector("#camera-action");
    let hasPhrase = false;
    let activeStream;
    let particleFrame = 0;
    let particleCleanupTimer = 0;
    let previousSceneIndex = 0;
    let expressionCandidate = "";
    let expressionCandidateFrames = 0;
    let neutralFrameCount = 0;
    let lastTriggeredExpression = "";
    let lastExpressionTriggerAt = 0;
    let detectorOptions;
    let remainingNotes = [];

    document.querySelector("#collection-count").textContent = `FROM YOUR LETTERS / ${loveNotes.length} NOTES`;

    function takeNextNote(preferredStyles = null) {
      if (!remainingNotes.length) {
        remainingNotes = [...loveNotes];
        for (let index = remainingNotes.length - 1; index > 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [remainingNotes[index], remainingNotes[randomIndex]] = [remainingNotes[randomIndex], remainingNotes[index]];
        }
        if (remainingNotes.length > 1 && remainingNotes[0].id === quoteText.dataset.noteId) {
          const swapIndex = 1 + Math.floor(Math.random() * (remainingNotes.length - 1));
          [remainingNotes[0], remainingNotes[swapIndex]] = [remainingNotes[swapIndex], remainingNotes[0]];
        }
      }

      const matchingIndexes = preferredStyles
        ? remainingNotes.reduce((indexes, note, index) => {
            if (preferredStyles.includes(note.style)) indexes.push(index);
            return indexes;
          }, [])
        : [];
      const availableIndexes = matchingIndexes.length
        ? matchingIndexes
        : remainingNotes.map((_, index) => index);
      const selectedIndex = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
      return remainingNotes.splice(selectedIndex, 1)[0];
    }

    function clearParticleReveal() {
      if (particleFrame) window.cancelAnimationFrame(particleFrame);
      if (particleCleanupTimer) window.clearTimeout(particleCleanupTimer);
      particleFrame = 0;
      particleCleanupTimer = 0;
      particleCanvas.classList.remove("is-fading");
      particleCanvas.hidden = true;
      const context = particleCanvas.getContext("2d");
      if (context) context.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
    }

    function revealSource() {
      quoteSource.hidden = false;
      quoteSource.classList.remove("is-visible");
      void quoteSource.offsetWidth;
      quoteSource.classList.add("is-visible");
    }

    function changeSceneColor() {
      let index = Math.floor(Math.random() * scenePalettes.length);
      while (index === previousSceneIndex) index = Math.floor(Math.random() * scenePalettes.length);
      previousSceneIndex = index;
      const palette = scenePalettes[index];
      const root = document.documentElement;
      root.style.setProperty("--scene-color", palette.color);
      root.style.setProperty("--red", palette.color);
      root.style.setProperty("--teal", palette.shade);
      document.querySelector('meta[name="theme-color"]').content = palette.color;
    }

    function animateQuoteParticles() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return false;
      const context = particleCanvas.getContext("2d");
      const sampleCanvas = document.createElement("canvas");
      const sampleContext = sampleCanvas.getContext("2d", { willReadFrequently: true });
      const areaRect = quoteArea.getBoundingClientRect();
      const textNode = quoteText.firstChild;
      if (!context || !sampleContext || !textNode || !areaRect.width || !areaRect.height) return false;

      try {
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.round(areaRect.width * pixelRatio);
        const height = Math.round(areaRect.height * pixelRatio);
        sampleCanvas.width = width;
        sampleCanvas.height = height;
        particleCanvas.width = width;
        particleCanvas.height = height;
        particleCanvas.hidden = false;
        particleCanvas.classList.remove("is-fading");
        sampleContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        sampleContext.font = getComputedStyle(quoteText).font;
        sampleContext.textBaseline = "middle";
        sampleContext.fillStyle = "#fff8ed";

        const range = document.createRange();
        let textOffset = 0;
        for (const character of Array.from(quoteText.textContent)) {
          range.setStart(textNode, textOffset);
          range.setEnd(textNode, textOffset + character.length);
          textOffset += character.length;
          if (/\s/.test(character)) continue;
          const rect = range.getBoundingClientRect();
          sampleContext.fillText(character, rect.left - areaRect.left, rect.top - areaRect.top + rect.height / 2);
        }

        const image = sampleContext.getImageData(0, 0, width, height).data;
        const targets = [];
        const sampleStep = Math.max(4, Math.round(pixelRatio * 3));
        for (let y = 0; y < height; y += sampleStep) {
          for (let x = 0; x < width; x += sampleStep) {
            if (image[(y * width + x) * 4 + 3] > 100) {
              targets.push({ x: x / pixelRatio, y: y / pixelRatio });
            }
          }
        }
        if (!targets.length) {
          particleCanvas.hidden = true;
          return false;
        }

        const particles = targets.map((target) => ({
          ...target,
          startX: Math.random() * areaRect.width,
          startY: Math.random() * areaRect.height,
          radius: .65 + Math.random() * .55,
          phase: Math.random() * Math.PI * 2
        }));
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        context.clearRect(0, 0, areaRect.width, areaRect.height);
        quoteText.classList.add("is-forming");

        const startTime = performance.now();
        const duration = 1750;
        function drawParticles(time) {
          const progress = Math.min((time - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const drift = (1 - progress) * 8;
          context.clearRect(0, 0, areaRect.width, areaRect.height);
          context.fillStyle = "#fff8ed";
          context.globalAlpha = .65 + progress * .35;
          for (const particle of particles) {
            const x = particle.startX + (particle.x - particle.startX) * eased + Math.sin(time * .004 + particle.phase) * drift;
            const y = particle.startY + (particle.y - particle.startY) * eased + Math.cos(time * .004 + particle.phase) * drift;
            context.beginPath();
            context.arc(x, y, particle.radius, 0, Math.PI * 2);
            context.fill();
          }
          context.globalAlpha = 1;

          if (progress < 1) {
            particleFrame = window.requestAnimationFrame(drawParticles);
            return;
          }

          particleFrame = 0;
          quoteText.classList.remove("is-forming");
          quoteText.classList.add("is-visible");
          particleCanvas.classList.add("is-fading");
          revealSource();
          particleCleanupTimer = window.setTimeout(clearParticleReveal, 520);
        }

        particleFrame = window.requestAnimationFrame(drawParticles);
        return true;
      } catch {
        particleCanvas.hidden = true;
        quoteText.classList.remove("is-forming");
        return false;
      }
    }

    function showNextNote(preferredStyles = null) {
      clearParticleReveal();
      const note = takeNextNote(preferredStyles);
      changeSceneColor();
      quoteText.classList.remove("is-visible", "is-forming");
      void quoteText.offsetWidth;
      quoteText.textContent = note.text;
      quoteText.dataset.noteId = note.id;
      quoteSource.textContent = `—— ${note.source}`;
      quoteSource.hidden = true;
      quoteSource.classList.remove("is-visible");
      if (!animateQuoteParticles()) {
        quoteText.classList.add("is-visible");
        revealSource();
      }
      hasPhrase = true;
    }

    function setCameraStatus(message, active = false) {
      statusText.textContent = message;
      cameraDot.dataset.active = String(active);
    }

    function enterManualMode(message) {
      if (activeStream) activeStream.getTracks().forEach((track) => track.stop());
      activeStream = null;
      video.srcObject = null;
      cameraPlaceholder.hidden = false;
      cameraPlaceholder.innerHTML = "镜头未开启，<br>仍可继续抽取。";
      setCameraStatus(message);
      cameraAction.replaceChildren();
    }

    function loadFaceApi() {
      if (window.faceapi) return Promise.resolve(window.faceapi);
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js";
        script.onload = () => window.faceapi ? resolve(window.faceapi) : reject(new Error("人脸检测库未能启动"));
        script.onerror = () => reject(new Error("人脸检测库加载失败"));
        document.head.appendChild(script);
      });
    }

    function processFaceExpression(expressions) {
      const ranked = Object.entries(expressions)
        .filter(([name]) => name !== "neutral")
        .sort((first, second) => second[1] - first[1]);
      const strongest = ranked[0];
      if (!strongest || strongest[1] < .78) {
        expressionCandidate = "";
        expressionCandidateFrames = 0;
        neutralFrameCount = (expressions.neutral || 0) >= .65 ? neutralFrameCount + 1 : 0;
        if (neutralFrameCount >= 2) lastTriggeredExpression = "";
        setCameraStatus("看见你了，摆一个明显表情试试。", true);
        return false;
      }

      neutralFrameCount = 0;
      const [expression] = strongest;
      const profile = expressionProfiles[expression];
      if (!profile) return false;

      if (expression === expressionCandidate) {
        expressionCandidateFrames += 1;
      } else {
        expressionCandidate = expression;
        expressionCandidateFrames = 1;
      }

      if (expressionCandidateFrames < 2) {
        setCameraStatus(`捕捉到${profile.label}，保持一下…`, true);
        return false;
      }
      if (expression === lastTriggeredExpression) {
        setCameraStatus(`已捕捉到${profile.label}，换个表情再试试。`, true);
        return false;
      }
      if (Date.now() - lastExpressionTriggerAt < 1800) {
        setCameraStatus("表情识别中…", true);
        return false;
      }

      lastTriggeredExpression = expression;
      lastExpressionTriggerAt = Date.now();
      showNextNote(profile.styles);
      setCameraStatus(`识别到${profile.label}，送你一句心意。`, true);
      return true;
    }

    async function detectFaces(faceapi) {
      if (!activeStream) return;
      try {
        const faces = await faceapi.detectAllFaces(video, detectorOptions).withFaceExpressions();
        if (faces.length) {
          if (!hasPhrase) showNextNote();
          processFaceExpression(faces[0].expressions);
        } else {
          expressionCandidate = "";
          expressionCandidateFrames = 0;
          neutralFrameCount = 0;
          lastTriggeredExpression = "";
          setCameraStatus("镜头已开启，等待一张脸…", true);
        }
        window.setTimeout(() => detectFaces(faceapi), 350);
      } catch {
        enterManualMode("检测暂不可用，已切换手动模式。");
      }
    }

    async function startCamera() {
      cameraAction.replaceChildren();
      setCameraStatus("正在请求摄像头权限…");
      if (!navigator.mediaDevices?.getUserMedia) {
        enterManualMode("浏览器无法访问摄像头，已切换手动模式。");
        return;
      }
      try {
        activeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 24, max: 30 } }, audio: false });
        video.srcObject = activeStream;
        await video.play();
        cameraPlaceholder.hidden = true;
        setCameraStatus("正在准备本地人脸检测…", true);
        const faceapi = await loadFaceApi();
        const modelUrl = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(modelUrl),
          faceapi.nets.faceExpressionNet.loadFromUri(modelUrl)
        ]);
        detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: .5 });
        setCameraStatus("镜头已开启，等待一张脸…", true);
        detectFaces(faceapi);
      } catch (error) {
        const denied = error.name === "NotAllowedError" || error.name === "PermissionDeniedError";
        enterManualMode(denied ? "你拒绝了摄像头权限，已切换手动模式。" : "摄像头或检测库不可用，已切换手动模式。");
      }
    }

    document.querySelector("#next-button").addEventListener("click", showNextNote);
    startCamera();
  </script>
</body>
</html>
